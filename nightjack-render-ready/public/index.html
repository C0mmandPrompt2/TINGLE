<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071b17">
  <meta name="description" content="Nightjack is a private-room social Twenty-One card game. No wagers, purchases, or prizes.">
  <title>NIGHTJACK — Private tables. Good company.</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div id="app">
    <div class="loading-screen">
      <div class="brand-symbol">♠</div>
      <div class="brand-word">NIGHT<span>JACK</span></div>
      <div class="loading-line"></div>
      <p>Preparing your table...</p>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
